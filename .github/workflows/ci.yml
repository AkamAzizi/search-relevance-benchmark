name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check catalog tests

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest

      - name: Compile
        run: uv run python -m compileall -q catalog tests

      - name: Security audit
        run: uv run pip-audit --progress-spinner off
