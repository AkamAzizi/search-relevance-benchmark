[project]
name = "search-relevance-benchmark"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=8.0",
    "ruff>=0.16.5",
    "ty>=0.0.74",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
src = ["catalog", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E702", "E731"]

[tool.ty.src]
include = ["catalog"]
